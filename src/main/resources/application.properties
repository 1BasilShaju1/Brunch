# Server Configuration for Render & Local Environments
server.port=${PORT:8080}
server.address=0.0.0.0

# Application Name
spring.application.name=brunch

# Zero-Setup File-Based / In-Memory Database (No external MySQL server needed)
# Saves data to local file ./data/brunchdb so it persists during application runs
spring.datasource.url=jdbc:h2:file:./data/brunchdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA & Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Optional H2 Console (available at /h2-console if needed)
spring.h2.console.enabled=false

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
