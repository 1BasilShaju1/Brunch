<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Brunch - Admin</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<div class="navbar">
    <a class="logo" th:href="@{/}">Brunch</a>
    <div class="links">
        <a th:href="@{/cart}">Cart <span th:text="${session.cart != null ? '(' + session.cart.size() + ')' : ''}"></span></a>
        <a th:href="@{/admin}">Admin</a>
    </div>
</div>

<div class="container">
    <h1>Admin</h1>

    <!-- 1. Add a restaurant -->
    <h2>Add a restaurant</h2>
    <div class="card block">
        <form th:action="@{/admin/restaurant}" method="post">
            <label for="rName">Restaurant name</label>
            <input type="text" id="rName" name="name" required>

            <label for="rAddress">Address</label>
            <input type="text" id="rAddress" name="address" required>

            <button type="submit">Add Restaurant</button>
        </form>
    </div>

    <!-- 2. Add a food item -->
    <h2>Add a food item</h2>
    <div class="card block">
        <form th:action="@{/admin/food}" method="post">
            <label for="restaurantId">Restaurant</label>
            <select id="restaurantId" name="restaurantId" required>
                <option th:each="r : ${restaurants}" th:value="${r.id}" th:text="${r.name}">Restaurant</option>
            </select>

            <label for="fName">Food name</label>
            <input type="text" id="fName" name="name" required>

            <label for="fPrice">Price (₹)</label>
            <input type="number" id="fPrice" name="price" min="1" step="0.01" required>

            <button type="submit">Add Food Item</button>
        </form>
    </div>

    <!-- Current menus -->
    <h2>Restaurants and menus</h2>
    <div class="card block" th:each="r : ${restaurants}">
        <strong th:text="${r.name}">Restaurant</strong>
        <ul>
            <li th:each="f : ${foodItems}" th:if="${f.restaurantId == r.id}">
                <span th:text="${f.name}">Food</span> -
                ₹<span th:text="${#numbers.formatDecimal(f.price, 1, 2)}">0.00</span>
            </li>
        </ul>
    </div>

    <!-- 3 and 4. All orders + change status -->
    <h2>Orders</h2>
    <p th:if="${orders.isEmpty()}">No orders yet.</p>

    <table th:unless="${orders.isEmpty()}">
        <tr>
            <th>#</th>
            <th>Customer</th>
            <th>Items</th>
            <th>Total</th>
            <th>Status</th>
        </tr>
        <tr th:each="o : ${orders}">
            <td th:text="${o.id}">1</td>
            <td>
                <span th:text="${o.customerName}">Name</span><br>
                <span class="muted" th:text="${o.phone}">Phone</span><br>
                <span class="muted" th:text="${o.address}">Address</span>
            </td>
            <td>
                <div th:each="item : ${o.items}" th:text="${item.quantity + ' x ' + item.name}">1 x Pizza</div>
            </td>
            <td>₹<span th:text="${#numbers.formatDecimal(o.totalAmount, 1, 2)}">0.00</span></td>
            <td>
                <span class="status" th:text="${o.status}">PLACED</span>
                <form class="inline-form" th:action="@{/admin/order/{id}/status(id=${o.id})}" method="post">
                    <select name="status">
                        <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"
                                th:selected="${s == o.status}">PLACED</option>
                    </select>
                    <button type="submit">Update</button>
                </form>
            </td>
        </tr>
    </table>
</div>

</body>
</html>
