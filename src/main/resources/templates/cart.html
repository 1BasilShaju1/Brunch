<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Shopping Cart - Brunch</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container">
    <h1>Your Food Cart</h1>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div th:if="${#lists.isEmpty(cart.items)}" class="empty-state">
        <p>Your cart is empty.</p>
        <a th:href="@{/menu}" class="btn btn-primary">Browse Menu</a>
    </div>

    <div th:unless="${#lists.isEmpty(cart.items)}" class="cart-layout">
        <div class="cart-items-panel">
            <div th:each="item : ${cart.items}" class="cart-item-row">
                <div class="cart-item-info">
                    <h3 th:text="${item.menuItem.name}">Item Name</h3>
                    <p class="muted">Price: ₹<span th:text="${#numbers.formatDecimal(item.menuItem.price, 1, 2)}">0.00</span></p>
                </div>
                <div class="cart-item-actions">
                    <form th:action="@{/cart/update/{id}(id=${item.id})}" method="post" class="form-inline">
                        <input type="number" name="quantity" th:value="${item.quantity}" min="1" max="50" class="form-control qty-input"/>
                        <button type="submit" class="btn btn-sm btn-outline">Update</button>
                    </form>
                    <div class="cart-subtotal">₹<span th:text="${#numbers.formatDecimal(item.subtotal, 1, 2)}">0.00</span></div>
                    <form th:action="@{/cart/remove/{id}(id=${item.id})}" method="post">
                        <button type="submit" class="btn btn-sm btn-danger">&times;</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="cart-summary-panel">
            <div class="card summary-card">
                <h3>Order Summary</h3>
                <div class="summary-line">
                    <span>Items Subtotal:</span>
                    <span>₹<span th:text="${#numbers.formatDecimal(subtotal, 1, 2)}">0.00</span></span>
                </div>
                <div class="summary-line">
                    <span>Delivery Fee:</span>
                    <span>₹30.00</span>
                </div>
                <hr/>
                <div class="summary-line total-line">
                    <span>Estimated Total:</span>
                    <span>₹<span th:text="${#numbers.formatDecimal(total, 1, 2)}">0.00</span></span>
                </div>
                <a th:href="@{/checkout}" class="btn btn-primary btn-block btn-lg">Proceed to Checkout</a>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
