<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Brunch - Order Confirmed</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<div class="navbar">
    <a class="logo" th:href="@{/}">Brunch</a>
    <div class="links">
        <a th:href="@{/cart}">Cart <span th:text="${session.cart != null ? '(' + session.cart.size() + ')' : ''}"></span></a>
        <a th:href="@{/admin}">Admin</a>
    </div>
</div>

<div class="container">
    <h1>Thank you, <span th:text="${order.customerName}">Name</span>!</h1>
    <p>Your order <strong>#<span th:text="${order.id}">1</span></strong> has been placed.</p>
    <p>Status: <span class="status" th:text="${order.status}">PLACED</span></p>

    <div class="card block">
        <p><strong>Phone:</strong> <span th:text="${order.phone}">Phone</span></p>
        <p><strong>Delivery address:</strong> <span th:text="${order.address}">Address</span></p>
    </div>

    <table>
        <tr>
            <th>Item</th>
            <th>Qty</th>
            <th>Subtotal</th>
        </tr>
        <tr th:each="item : ${order.items}">
            <td th:text="${item.name}">Name</td>
            <td th:text="${item.quantity}">1</td>
            <td>₹<span th:text="${#numbers.formatDecimal(item.lineTotal, 1, 2)}">0.00</span></td>
        </tr>
    </table>

    <div class="total">Total: ₹<span th:text="${#numbers.formatDecimal(order.totalAmount, 1, 2)}">0.00</span></div>

    <a class="btn" th:href="@{/}">Order more food</a>
</div>

</body>
</html>
