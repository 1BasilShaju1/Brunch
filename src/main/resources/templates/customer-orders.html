<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - Brunch</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container">
    <h1>Your Order History</h1>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div th:if="${#lists.isEmpty(orders)}" class="empty-state">
        <span class="empty-icon">📦</span>
        <h3>No orders placed yet</h3>
        <p>Explore menus from our top restaurants and order delicious food today!</p>
        <a th:href="@{/restaurants}" class="btn btn-primary">Find Restaurants</a>
    </div>

    <div th:unless="${#lists.isEmpty(orders)}" class="orders-list">
        <div th:each="order : ${orders}" class="card order-card">
            <div class="order-card-header">
                <div>
                    <h3 th:text="'Order #' + ${order.id}">Order #1</h3>
                    <span class="muted" th:text="${#temporals.format(order.orderDate, 'dd-MMM-yyyy HH:mm')}">Date</span>
                </div>
                <div>
                    <span th:replace="~{fragments/order-status :: orderStatus(${order.orderStatus})}"></span>
                </div>
            </div>

            <div class="order-card-body">
                <p th:if="${order.restaurant != null}">
                    <strong>Restaurant:</strong> 
                    <a th:href="@{/restaurants/{id}(id=${order.restaurant.id})}" th:text="${order.restaurant.restaurantName}">Restaurant</a>
                </p>
                <p><strong>Order Type:</strong> <span th:text="${order.orderType}">Delivery</span> | 
                   <strong>Payment:</strong> <span th:text="${order.paymentMethod}">Cash on Delivery</span></p>
                <p th:if="${order.orderType == 'Delivery'}"><strong>Address:</strong> <span th:text="${order.deliveryAddress}">Address</span></p>

                <ul class="order-items-preview">
                    <li th:each="item : ${order.items}">
                        <span th:text="${item.quantity} + 'x ' + ${item.itemName}">1x Masala Dosa</span>
                        <span>₹<span th:text="${#numbers.formatDecimal(item.subtotal, 1, 2)}">0.00</span></span>
                    </li>
                </ul>

                <div class="order-card-footer">
                    <div>
                        <strong>Total: ₹<span th:text="${#numbers.formatDecimal(order.finalAmount, 1, 2)}">0.00</span></strong>
                    </div>
                    <div>
                        <form th:if="${order.orderStatus == 'PENDING'}" th:action="@{/orders/{id}/cancel(id=${order.id})}" method="post" style="display:inline;">
                            <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure you want to cancel this pending order?');">Cancel Order</button>
                        </form>
                        <a th:href="@{/orders/{id}(id=${order.id})}" class="btn btn-sm btn-outline">Receipt</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
