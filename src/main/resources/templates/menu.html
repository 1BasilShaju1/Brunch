<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Menu - Brunch</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container">
    <div class="menu-header">
        <h1>Explore Our Fresh Menu</h1>
        <form th:action="@{/menu/search}" method="get" class="search-form">
            <input type="text" name="query" class="form-control" placeholder="Search dishes..." th:value="${searchQuery}"/>
            <button type="submit" class="btn btn-primary">Search</button>
        </form>
    </div>

    <div class="filter-bar">
        <a th:href="@{/menu}" class="filter-pill" th:classappend="${selectedCategory == 'All' ? 'active' : ''}">All Items</a>
        <a th:href="@{/menu/category/Breakfast}" class="filter-pill" th:classappend="${selectedCategory == 'Breakfast' ? 'active' : ''}">Breakfast</a>
        <a th:href="@{/menu/category/Main Course}" class="filter-pill" th:classappend="${selectedCategory == 'Main Course' ? 'active' : ''}">Main Course</a>
        <a th:href="@{/menu/category/Snacks}" class="filter-pill" th:classappend="${selectedCategory == 'Snacks' ? 'active' : ''}">Snacks</a>
        <a th:href="@{/menu/category/Drinks}" class="filter-pill" th:classappend="${selectedCategory == 'Drinks' ? 'active' : ''}">Drinks</a>
        <a th:href="@{/menu/category/Desserts}" class="filter-pill" th:classappend="${selectedCategory == 'Desserts' ? 'active' : ''}">Desserts</a>
    </div>

    <div th:if="${#lists.isEmpty(menuItems)}" class="empty-state">
        <p>No food items found matching your criteria.</p>
        <a th:href="@{/menu}" class="btn btn-outline">Clear Filters</a>
    </div>

    <div th:unless="${#lists.isEmpty(menuItems)}" class="menu-grid">
        <div th:each="item : ${menuItems}">
            <div th:replace="~{fragments/menu-card :: menuCard(${item})}"></div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
