<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Profile - Brunch</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container">
    <div class="dashboard-header">
        <div>
            <h1>Restaurant Profile &amp; Settings</h1>
            <p>Customize how your kitchen appears to customers across the Brunch platform.</p>
        </div>
        <div>
            <a th:href="@{/restaurants/{id}(id=${restaurant.id})}" class="btn btn-outline" target="_blank">View Public Page &nearr;</a>
        </div>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="card form-card">
        <form th:action="@{/restaurant/profile}" th:object="${profileForm}" method="post">
            <div class="form-row">
                <div class="form-group col-md-6">
                    <label for="restaurantName">Restaurant Name <span class="required">*</span></label>
                    <input type="text" id="restaurantName" th:field="*{restaurantName}" class="form-control" required/>
                    <span class="field-error" th:if="${#fields.hasErrors('restaurantName')}" th:errors="*{restaurantName}"></span>
                </div>

                <div class="form-group col-md-6">
                    <label for="phone">Contact Phone Number <span class="required">*</span></label>
                    <input type="text" id="phone" th:field="*{phone}" class="form-control" required/>
                    <span class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
                </div>
            </div>

            <div class="form-group">
                <label for="description">Kitchen Description / Tagline</label>
                <textarea id="description" th:field="*{description}" class="form-control" rows="3" placeholder="Tell customers what makes your food special..."></textarea>
            </div>

            <div class="form-row">
                <div class="form-group col-md-6">
                    <label for="city">City <span class="required">*</span></label>
                    <input type="text" id="city" th:field="*{city}" class="form-control" placeholder="e.g. Bangalore" required/>
                    <span class="field-error" th:if="${#fields.hasErrors('city')}" th:errors="*{city}"></span>
                </div>

                <div class="form-group col-md-6">
                    <label for="address">Full Address <span class="required">*</span></label>
                    <input type="text" id="address" th:field="*{address}" class="form-control" placeholder="e.g. 104 Indiranagar 100ft Road" required/>
                    <span class="field-error" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></span>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group col-md-6">
                    <label for="openingTime">Opening Time</label>
                    <input type="text" id="openingTime" th:field="*{openingTime}" class="form-control" placeholder="e.g. 08:00 AM"/>
                </div>

                <div class="form-group col-md-6">
                    <label for="closingTime">Closing Time</label>
                    <input type="text" id="closingTime" th:field="*{closingTime}" class="form-control" placeholder="e.g. 11:00 PM"/>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary btn-lg">Save Profile Changes</button>
                <a th:href="@{/restaurant/dashboard}" class="btn btn-outline btn-lg">Cancel</a>
            </div>
        </form>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
