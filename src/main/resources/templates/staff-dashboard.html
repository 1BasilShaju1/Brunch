<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Dashboard - Brunch</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container">
    <div class="dashboard-header">
        <h1>Staff Control Panel</h1>
        <p>Logged in as: <strong th:text="${staff.fullName}">Staff Member</strong></p>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <span class="stat-num" th:text="${totalMenuItems}">0</span>
            <span class="stat-label">Total Menu Items</span>
        </div>
        <div class="stat-card">
            <span class="stat-num" th:text="${totalOrders}">0</span>
            <span class="stat-label">Total Orders Placed</span>
        </div>
        <div class="stat-card stat-card-alert">
            <span class="stat-num" th:text="${pendingOrders}">0</span>
            <span class="stat-label">Pending Orders</span>
        </div>
    </div>

    <div class="dashboard-actions">
        <a th:href="@{/staff/menu}" class="dashboard-card">
            <span class="icon">🍳</span>
            <h3>Manage Menu</h3>
            <p>Add new dishes, modify prices, or toggle item availability</p>
        </a>
        <a th:href="@{/staff/orders}" class="dashboard-card">
            <span class="icon">📋</span>
            <h3>View &amp; Update Orders</h3>
            <p>Accept new incoming orders and progress order statuses</p>
        </a>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
