<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Menu - Staff</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container">
    <div class="section-header-row">
        <h1>Staff Menu Management</h1>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <!-- Add / Edit Form Card -->
    <div class="card form-card">
        <h3 th:text="${editing} ? 'Edit Menu Item' : 'Add New Menu Item'">Add Menu Item</h3>
        <form th:action="${editing} ? @{/staff/menu/edit/{id}(id=${menuItemForm.id})} : @{/staff/menu/add}" 
              th:object="${menuItemForm}" method="post">
            <input type="hidden" th:field="*{id}"/>

            <div class="form-row">
                <div class="form-group flex-2">
                    <label for="name">Item Name</label>
                    <input type="text" id="name" th:field="*{name}" class="form-control" required/>
                    <span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
                </div>
                <div class="form-group flex-1">
                    <label for="category">Category</label>
                    <select id="category" th:field="*{category}" class="form-control" required>
                        <option value="Breakfast">Breakfast</option>
                        <option value="Main Course">Main Course</option>
                        <option value="Snacks">Snacks</option>
                        <option value="Drinks">Drinks</option>
                        <option value="Desserts">Desserts</option>
                    </select>
                    <span class="field-error" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></span>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group flex-1">
                    <label for="price">Price (₹)</label>
                    <input type="number" step="0.01" id="price" th:field="*{price}" class="form-control" required/>
                    <span class="field-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></span>
                </div>
                <div class="form-group flex-1">
                    <label for="availability">Availability</label>
                    <select id="availability" th:field="*{availability}" class="form-control" required>
                        <option value="Available">Available</option>
                        <option value="Unavailable">Unavailable</option>
                    </select>
                    <span class="field-error" th:if="${#fields.hasErrors('availability')}" th:errors="*{availability}"></span>
                </div>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" th:field="*{description}" class="form-control" rows="2" required></textarea>
                <span class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>
            </div>

            <button type="submit" class="btn btn-primary" th:text="${editing} ? 'Update Item' : 'Add Item'">Save</button>
            <a th:if="${editing}" th:href="@{/staff/menu}" class="btn btn-outline">Cancel</a>
        </form>
    </div>

    <!-- Existing Menu Items Table -->
    <div class="table-responsive">
        <table class="table">
            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Category</th>
                <th>Price</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${menuItems}">
                <td th:text="${item.id}">1</td>
                <td>
                    <strong th:text="${item.name}">Dish</strong>
                    <div class="muted small" th:text="${item.description}">Desc</div>
                </td>
                <td th:text="${item.category}">Category</td>
                <td>₹<span th:text="${#numbers.formatDecimal(item.price, 1, 2)}">0.00</span></td>
                <td>
                    <span class="badge" th:classappend="${item.availability == 'Available' ? 'badge-success' : 'badge-danger'}"
                          th:text="${item.availability}">Available</span>
                </td>
                <td class="action-buttons">
                    <form th:action="@{/staff/menu/availability/{id}(id=${item.id})}" method="post" style="display:inline;">
                        <button type="submit" class="btn btn-sm btn-outline">Toggle Status</button>
                    </form>
                    <a th:href="@{/staff/menu/edit/{id}(id=${item.id})}" class="btn btn-sm btn-secondary">Edit</a>
                    <form th:action="@{/staff/menu/delete/{id}(id=${item.id})}" method="post" style="display:inline;"
                          onsubmit="return confirmDelete('Are you sure you want to delete this menu item?');">
                        <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
