<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Orders - Staff</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container">
    <h1>Staff Order Management</h1>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

    <div th:if="${#lists.isEmpty(orders)}" class="empty-state">
        <p>No orders available in the system.</p>
    </div>

    <div th:unless="${#lists.isEmpty(orders)}" class="table-responsive">
        <table class="table">
            <thead>
            <tr>
                <th>Order #</th>
                <th>Customer</th>
                <th>Items Ordered</th>
                <th>Total</th>
                <th>Type &amp; Address</th>
                <th>Status</th>
                <th>Update Status</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="order : ${orders}">
                <td>
                    <strong th:text="'#' + ${order.id}">#1</strong>
                    <div class="muted small" th:text="${#temporals.format(order.orderDate, 'dd-MMM HH:mm')}">Date</div>
                </td>
                <td>
                    <div th:text="${order.customer.fullName}">Customer Name</div>
                    <div class="muted small" th:text="${order.customer.phone}">Phone</div>
                </td>
                <td>
                    <ul class="items-list-compact">
                        <li th:each="item : ${order.items}" th:text="${item.quantity} + 'x ' + ${item.itemName}">Item</li>
                    </ul>
                </td>
                <td>₹<span th:text="${#numbers.formatDecimal(order.finalAmount, 1, 2)}">0.00</span></td>
                <td>
                    <strong th:text="${order.orderType}">Delivery</strong>
                    <div class="muted small" th:text="${order.deliveryAddress}">Address</div>
                </td>
                <td>
                    <div th:replace="~{fragments/order-status :: orderStatus(${order.orderStatus})}"></div>
                </td>
                <td>
                    <form th:action="@{/staff/orders/{id}/status(id=${order.id})}" method="post" class="form-inline">
                        <select name="status" class="form-control form-control-sm">
                            <option value="PENDING" th:selected="${order.orderStatus == 'PENDING'}">PENDING</option>
                            <option value="ACCEPTED" th:selected="${order.orderStatus == 'ACCEPTED'}">ACCEPTED</option>
                            <option value="PREPARING" th:selected="${order.orderStatus == 'PREPARING'}">PREPARING</option>
                            <option value="READY_FOR_PICKUP" th:selected="${order.orderStatus == 'READY_FOR_PICKUP'}">READY_FOR_PICKUP</option>
                            <option value="OUT_FOR_DELIVERY" th:selected="${order.orderStatus == 'OUT_FOR_DELIVERY'}">OUT_FOR_DELIVERY</option>
                            <option value="DELIVERED" th:selected="${order.orderStatus == 'DELIVERED'}">DELIVERED</option>
                            <option value="CANCELLED" th:selected="${order.orderStatus == 'CANCELLED'}">CANCELLED</option>
                        </select>
                        <button type="submit" class="btn btn-sm btn-primary">Update</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
